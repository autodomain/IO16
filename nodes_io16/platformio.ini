; PlatformIO Project Configuration File
; Project: PJON Client 8 Buttons / 8 LEDs (RS485)

[platformio]
default_envs = atmega324pb

[common]
framework = arduino
monitor_speed = 38400
lib_deps =
    gioblu/PJON @ ^13.1
    jandelgado/JLed @ ^4.15.0
    poelstra/MultiButton @ ^1.3.0

[env:atmega324pb]
platform = atmelavr
board = ATmega324PB
framework = ${common.framework}
board_build.f_cpu = 16000000L
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -Wall
upload_protocol = usbasp
upload_flags =
    -p
    m324pb
    -e

[env:atmega1284p]
platform = atmelavr
board = ATmega1284P
framework = ${common.framework}
board_build.f_cpu = 16000000L
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -Wall
upload_protocol = usbasp
upload_flags =
    -p
    m1284p
    -e

[env:atmega128]
platform = atmelavr
board = ATmega128
framework = ${common.framework}
board_build.f_cpu = 16000000L
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -Wall

