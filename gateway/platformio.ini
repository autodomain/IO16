; PlatformIO Project Configuration File
; Project: MQTT Gateway (W5500 + PJON RS485 + MQTT)
; Target MCU: ATmega128 (Microchip AVR)

[platformio]
default_envs = atmega1284

[common]
framework = arduino
monitor_speed = 38400
lib_deps =
    arduino-libraries/Ethernet @ ^2.0.2
    knolleary/PubSubClient @ ^2.8
    gioblu/PJON @ ^13.1

[env:atmega1284]
platform = atmelavr
board = ATmega1284
framework = ${common.framework}
board_build.f_cpu = 16000000L
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -Wall
    -D MQTT_MAX_PACKET_SIZE=512
upload_protocol = usbasp
upload_flags =
    -p
    m1284
    -e

[env:atmega1284p]
platform = atmelavr
board = ATmega1284P
framework = ${common.framework}
board_build.f_cpu = 16000000L
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -Wall
    -D MQTT_MAX_PACKET_SIZE=512
upload_protocol = usbasp
upload_flags =
    -p
    m1284p
    -e

[env:atmega128]
platform = atmelavr
board = ATmega128
framework = ${common.framework}
board_build.f_cpu = 16000000L
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -Wall
    -D MQTT_MAX_PACKET_SIZE=512
upload_protocol = usbasp
upload_flags =
    -e
